name: CareerPilot CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        run: python -m pip install -r services/api/requirements-dev.txt
      - name: Python security/quality lint
        run: ruff check services tests --select E4,E7,E9,F
      - name: API tests
        run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Frontend build and typecheck
        working-directory: apps/web
        run: npm run build
