name: Security Gates
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '21 4 * * 1'
permissions:
  contents: read
concurrency:
  group: security-gates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-gates:
    name: security-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free security analyzers
        run: python -m pip install 'pip-audit>=2.7,<3' 'bandit>=1.8,<2' 'detect-secrets>=1.5,<2'
      - name: Audit Python runtime dependencies
        run: python -m pip_audit -r services/api/requirements.txt --strict
      - name: Scan Python for high severity security problems
        run: bandit -q -r services/api services/ingestion -ll
      - name: Scan tracked code for potential secrets
        run: |
          detect-secrets scan --exclude-files '(^|/)package-lock\.json$' > /tmp/careerpilot-secrets.json
          python - <<'PYSEC'
          import json
          report = json.load(open('/tmp/careerpilot-secrets.json'))
          findings = report.get('results', {})
          if findings:
              print('Possible secrets found (paths only; values hidden):')
              for path in sorted(findings):
                  print(path)
              raise SystemExit(1)
          print('No candidate secrets detected by this scanner')
          PYSEC
      - name: Install locked frontend dependencies
        run: npm ci --no-fund
        working-directory: apps/web
      - name: Audit npm production and development dependencies
        run: npm audit --audit-level=high
        working-directory: apps/web
