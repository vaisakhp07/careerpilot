services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careerpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally before starting postgres}
      POSTGRES_DB: careerpilot
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - careerpilot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpilot -d careerpilot"]
      interval: 5s
      retries: 10
volumes:
  careerpilot_pg:
